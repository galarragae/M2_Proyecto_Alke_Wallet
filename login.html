<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Elizabeth Galarraga G." />
  <title>Wallet: Log In</title>

  <!-- JQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">


  <!-- Mi CSS -->
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<body>
  <header class="d-flex justify-content-center" id="top">
    <h1>
      <a href="./home.html" class="alkeHome">Alke Wallet</a>
    </h1>
  </header>
  <main class="col-md-6 mx-auto">
    <section class="container login">
      <h2>Inicio de sesión</h2>

      <!-- FORM LOGIN -->
      <form class="row col-lg-12 mx-auto px-5" id="loginForm">
        <div class="mb-3">
          <label for="loginEmail" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="Ej: juanitoperez@mail.com" />
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="Escriba aquí su contraseña" />
          <div id="passwordHelpBlock" class="form-text">
            Tu contraseña debe tener 4 números <br>
            No debe contener letras, símbolos ni espacios
          </div>
        </div>
        <div class="d-flex flex-column justify-content-center mt-3">
          <!-- BUTTON TRIGGER MODAL LOGIN -->
          <button id="loginBtn" type="submit" class="btn btn-1 mx-auto text-nowrap">Iniciar sesión</button>
          <a href="" class="text-center mt-3">¿Olvidaste tu contraseña?</a>
        </div>
      </form>
    </section>
  </main>
  <footer class="col-md-6 mx-auto">
    <div class="row">
      <h5>Elizabeth Galarraga @ 2026</h5>
      <h5 class="mt-2">Todos los derechos reservados</h5>
    </div>
  </footer>

  <!-- MODAL LOGIN  -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div id="loginModalMessage" class="modal-body">
          <!-- AQUÍ VA EL TEXTO AGREGADO CON JS/Jquery  -->
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script src="./assets/js/login.js"></script>
</body>

</html>
