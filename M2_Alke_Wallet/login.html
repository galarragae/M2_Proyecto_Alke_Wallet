  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <header class="d-flex justify-content-center" id="top">
    <h1>
      <a href="./home.html" class="alkeHome">Alke Wallet</a>
    </h1>
  </header>
  <main>
    <section class="container login">
      <h2>Inicio de sesión</h2>
      <form class="row col-md-6 mx-auto" id="loginForm">
        <div class="mb-3">
          <label for="loginEmail" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="Ej: juanitoperez@mail.com" />
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="Escriba aquí su contraseña" />
        </div>
        <button type="submit" class="btn btn-primary col-5 mx-auto">Iniciar sesión</button>
      </form>
    </section>
  </main>
  <footer class="py-4">
    <h5>Elizabeth Galarraga</h5>
    <a class="btn btn-secondary mt-2" href="#top" role="button">
      Volver al inicio de página</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script src="./assets/js/login.js"></script>
